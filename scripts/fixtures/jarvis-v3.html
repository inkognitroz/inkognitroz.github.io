</style><link rel="stylesheet" href="/apps/mimir-chat-portal/p0-release-nav.css"><section id="mmir-p0-app"><div class="p0-main-shell"><header class="p0-topbar"><span class="p0-brand">MMIR.ai</span><div class="p0-topbar-truth">DOM-kontrakttest · ikke live modell</div></header><section id="p0-release-warning">Testmiljø – ingen modell, mikrofon eller ekstern tjeneste brukes.</section><main class="p0-chat"><div id="p0-transcript"><article class="p0-message p0-message-user" data-p0-message-id="u0"><div class="p0-message-body">Vi planlegger en tur til Bergen.</div></article><article class="p0-message p0-message-assistant" data-p0-message-id="a0"><div class="p0-message-body">Da beholder vi Bergen som kontekst for oppfølgingsspørsmålene.</div></article></div></main><footer class="p0-composer-wrap"><form id="p0-composer" aria-busy="false"><textarea id="p0-input" aria-label="Spør MMIR"></textarea><div id="p0-route">Valgt rute og personvern tilhører MMIR</div><div class="toolbar"><button type="button" id="p0-privacy" aria-label="Sikkerhet og personvern: Offentlig modus">Personvern</button><span>Samme samtale</span><button type="button" id="p0-mic" data-voice-state="available">Mikrofon</button><button type="submit" id="p0-send">Send</button></div></form></footer></div></section><script src="/apps/mimir-chat-portal/p0-conversation-events.js"></script><script>
Object.defineProperty(window,'isSecureContext',{value:true,configurable:true});
window.fixture={requests:[],history:[{role:'user',content:'Vi planlegger en tur til Bergen.'},{role:'assistant',content:'Da beholder vi Bergen som kontekst.'}],recognitions:[],spoken:[],cancelled:0,coreMic:0,delay:80,noAnswer:false};

const F=window.fixture;
class FakeRecognition{constructor(){if(F.localSupport)this.processLocally=false}static async available(){return F.localResult||'unsupported'}start(){F.recognitions.push(this);this.active=true;this.onstart?.()}abort(){this.active=false;this.aborted=true}}
window.SpeechRecognition=FakeRecognition;

F.answer=text=>{const m=F.message;if(!m)return;const el=document.createElement('article');el.className='p0-message p0-message-assistant';el.dataset.p0MessageId=m.id;const body=document.createElement('div');body.className='p0-message-body';body.textContent=text;el.append(body);window.originalTranscript.append(el);F.history.push({role:'assistant',content:text});Object.assign(m,{content:text,answerState:'complete'});F.busy=false;form.setAttribute('aria-busy','false');F.contract.payload({usage:{total_tokens:18}});F.contract.complete(m)};
