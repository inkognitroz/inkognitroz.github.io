<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMIR.ai</title>
  <meta name="description" content="Open MMIR directly in Supergeni chat." />
  <meta http-equiv="refresh" content="0; url=/mmir.html#mimir-instant-start" />
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #0f172a; }
    main { width: min(680px, calc(100vw - 32px)); display: grid; gap: 16px; text-align: center; }
    .eyebrow { margin: 0; color: #047857; font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: 0; }
    p { margin: 0 auto; max-width: 560px; color: #475569; line-height: 1.55; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #0f172a; color: #fff; font-weight: 800; text-decoration: none; }
  </style>
  <script>
    (function(){
      var hash = window.location.hash || '#mimir-instant-start';
      var localTarget = './public/mmir.html' + hash;
      var hostedTarget = '/mmir.html' + hash;
      window.location.replace(window.location.protocol === 'file:' ? localTarget : hostedTarget);
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Chat-first Supergeni entry</p>
    <h1>MMIR</h1>
    <p>Opening the live chat. If redirect is blocked, continue to Supergeni.</p>
    <p><a href="/mmir.html#mimir-instant-start">Open Supergeni chat</a></p>
  </main>
</body>
</html>
