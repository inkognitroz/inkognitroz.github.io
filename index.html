<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMIR AI</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #f8fafc; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card { width: min(760px, 100%); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; padding: 2rem; background: rgba(255,255,255,.06); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -.04em; }
    p { line-height: 1.6; color: #cbd5e1; }
    .status { margin-top: 1.5rem; padding: 1rem; border-radius: 16px; background: rgba(15,23,42,.8); border: 1px solid rgba(148,163,184,.25); }
    .dot { display: inline-block; width: .8rem; height: .8rem; border-radius: 999px; background: #f59e0b; margin-right: .5rem; }
    .online .dot { background: #22c55e; }
    .offline .dot { background: #ef4444; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>MMIR AI</h1>
      <p>Frontend is live. The AI backend is being provisioned through IaC AutoProv on Oracle Cloud Infrastructure.</p>
      <div id="status" class="status">
        <strong><span class="dot"></span><span id="statusText">Checking backend status...</span></strong>
        <p id="statusMessage">Loading <code>/status.json</code>.</p>
      </div>
    </section>
  </main>
  <script>
    async function loadStatus() {
      const box = document.getElementById('status');
      const text = document.getElementById('statusText');
      const message = document.getElementById('statusMessage');
      try {
        const response = await fetch('/status.json', { cache: 'no-store' });
        const data = await response.json();
        const status = data.status || 'unknown';
        box.classList.remove('online', 'offline');
        if (status === 'online') box.classList.add('online');
        if (status === 'offline') box.classList.add('offline');
        text.textContent = status.replaceAll('_', ' ');
        message.textContent = data.message || 'No status message available.';
      } catch (error) {
        box.classList.add('offline');
        text.textContent = 'status unavailable';
        message.textContent = 'Could not load status.json.';
      }
    }
    loadStatus();
  </script>
</body>
</html>
