name: MMIR public branding migration

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/ensure-mmir-public-branding.js'
      - '.github/workflows/mmir-brand-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Remove retired public branding
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply MMIR branding migration
        run: node scripts/ensure-mmir-public-branding.js --write

      - name: Verify static smoke checks
        run: |
          set -euo pipefail
          node scripts/ensure-mmir-public-branding.js --check
          node scripts/smoke-check-pages.js
          node scripts/smoke-check-user-journeys.js
          node scripts/smoke-check-ui-actions.js

      - name: Commit migrated assets
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No MMIR branding migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "chore: remove retired SaaS Fabric public asset keys"
          git push
