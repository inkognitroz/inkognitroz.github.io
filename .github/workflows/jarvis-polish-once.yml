name: Final reviewed Jarvis corrections
on:
  push:
    branches: [fix/jarvis-voice-reliability-20260919]
    paths: [.github/workflows/jarvis-polish-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/jarvis-voice-reliability-20260919
          fetch-depth: 0
      - name: Apply bounded reviewed delta and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded = ''
          encoded = encoded.replace('Pr4Jham','Pr4rham').replace('XOZYZYIo','XOZYIo')
          # The SHA gate is mandatory; an altered transfer cannot be applied.
          patch = gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch) < 10000
          assert hashlib.sha256(patch).hexdigest() == '64f9bdd9c715f93f2ecc4fbdd36f2aeb70944736ed6a798eaf1e3b99e376049d'
          subprocess.run(['git','merge-base','--is-ancestor','5515d5014d21488e66ae6af6d5546c77b3cb76b6','HEAD'],check=True)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected = {'public/apps/mimir-chat-portal/p0-speech-utils.js':'cd0742e920bf251584f2666ab330b78adbd3cbbae8e8045a26858f9bdb6c9ed6','public/apps/mimir-chat-portal/p0-jarvis-skin.js':'0ab238053909589b9cf42906cec8f4ff23ada2113b3432d0b92f5e710990a991','scripts/test-jarvis-reliability.mjs':'b1fb3428a94cf09d71e3b02dd72e95544283c803a6c1a3e2f8cbc223a9d7a063','scripts/jarvis-reliability-scenarios.mjs':'271f41dd394fb9657262f7827a09092133e61b949d311f399dce951f09a8ff6b','JARVIS-RELIABILITY.md':'467dccd57b4e203af78e335f24fc283cfc1beb52092238ecec857b974a3719df'}
          for path,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest,path
          subprocess.run(['git','add','--',*expected],check=True)
          subprocess.run(['git','rm','--','.github/workflows/jarvis-polish-once.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(jarvis): preserve ambiguous unary signs and clarify no-submit dictation practice'
          git push origin HEAD:fix/jarvis-voice-reliability-20260919
      - name: Bounded public model-catalog diagnostic (GET only)
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module > /tmp/jarvis-models-diagnostic.json <<'JS'
          const report={at:new Date().toISOString(),scope:'public-model-catalog-shape-only'};
          try {
            const r=await fetch('https://api.mmir.ai/v1/models',{headers:{accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});
            report.status=r.status;report.contentType=r.headers.get('content-type');
            const reader=r.body.getReader();const chunks=[];let size=0;
            while(true){const p=await reader.read();if(p.done)break;size+=p.value.length;if(size>8000000){await reader.cancel();report.limitExceeded=true;break;}chunks.push(p.value);}
            report.bytes=size;
            if(!report.limitExceeded){try{const j=JSON.parse(Buffer.concat(chunks).toString('utf8'));report.validJson=true;report.dataArray=Array.isArray(j.data);report.modelsArray=Array.isArray(j.models);report.dataCount=Array.isArray(j.data)?j.data.length:null;}catch{report.validJson=false;}}
          }catch(e){report.error=/^[A-Za-z0-9_-]{1,50}$/.test(e.cause?.code||e.name)?e.cause?.code||e.name:'network_error';}
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-model-catalog-diagnostic
          path: /tmp/jarvis-models-diagnostic.json
          if-no-files-found: ignore
