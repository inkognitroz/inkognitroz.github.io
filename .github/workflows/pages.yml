name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Smoke check static site
        run: node scripts/smoke-check-pages.js
      - name: Check MMIR API route manifest
        run: node scripts/check-api-route-manifest.js
      - name: Smoke check UI action coverage
        run: node scripts/smoke-check-ui-actions.js
      - name: Smoke check mobile chat layout
        run: node scripts/smoke-check-mobile-chat.js
      - name: Smoke check performance budget
        run: node scripts/smoke-check-performance-budget.js
      - name: Smoke check first journey with mock local connector
        run: node scripts/smoke-check-first-journey-mock-local.js
      - name: Smoke check local install return
        run: node scripts/smoke-check-local-install-return.js
      - name: Smoke check activation simulator
        run: node scripts/smoke-check-activation-simulator.js
      - name: Smoke check activation replay render
        run: node scripts/smoke-check-activation-replay-render.js
      - name: Smoke check activation route map
        run: node scripts/smoke-check-activation-route-map.js
      - name: Smoke check activation closure
        run: node scripts/smoke-check-activation-closure.js
      - name: Smoke check user journeys
        run: node scripts/smoke-check-user-journeys.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
