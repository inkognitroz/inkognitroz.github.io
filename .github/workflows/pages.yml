name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Account-level Actions spend is hard-stopped. Operators can select an
    # ephemeral self-hosted runner for a cost-safe production publish.
    runs-on: ${{ fromJSON(vars.MMIR_PAGES_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check public boundary
        run: node scripts/check-public-boundary.js

      - name: Check public safety
        run: node scripts/public-safety-audit.js

      - name: Check MMIR branding
        run: node scripts/ensure-mmir-public-branding.js --check

      - name: Smoke check public shell
        run: node scripts/smoke-check-public-shell.js

      - name: Check gateway release contract
        run: |
          node scripts/smoke-check-release-0.2-catalogs.js
          node scripts/smoke-check-p0-route-tags.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
