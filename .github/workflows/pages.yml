      - name: Smoke check recommended starter install handoff
        run: node scripts/smoke-check-recommended-starter-install-handoff.js
      - name: Smoke check starter install repair fallback
        run: node scripts/smoke-check-starter-install-repair-fallback.js
      - name: Smoke check starter install retry after repair
        run: node scripts/smoke-check-starter-install-retry-after-repair.js
      - name: Smoke check starter retry success closure
        run: node scripts/smoke-check-starter-retry-success-closure.js
      - name: Smoke check first-answer send handoff
        run: node scripts/smoke-check-first-answer-send-handoff.js
      - name: Smoke check first-answer next step
        run: node scripts/smoke-check-first-answer-next-step.js
      - name: Smoke check visible-control dead ends
        run: node scripts/smoke-check-visible-control-dead-ends.js
      - name: Smoke check critical-shell headroom recovery
        run: node scripts/smoke-check-critical-shell-headroom-recovery.js
      - name: Smoke check DOM rendering hardening
        run: node scripts/smoke-check-dom-rendering-hardening.js
      - name: Smoke check deploy verification
        run: node scripts/smoke-check-deploy-verification.js
      - name: Smoke check first-screen visual QA
        run: node scripts/smoke-check-first-screen-visual-qa.js
      - name: Smoke check composer model picker
        run: node scripts/smoke-check-composer-model-picker.js
      - name: Smoke check node tunnel handoff
        run: node scripts/smoke-check-node-tunnel-handoff.js
      - name: Smoke check user journeys
        run: node scripts/smoke-check-user-journeys.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
