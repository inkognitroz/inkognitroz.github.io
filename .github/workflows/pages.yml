        run: node scripts/smoke-check-correction-remediation-execution-gates.js
      - name: Smoke check correction remediation rollback gates
        run: node scripts/smoke-check-correction-remediation-rollback-gates.js
      - name: Smoke check correction remediation knowledge source model
        run: node scripts/smoke-check-correction-remediation-knowledge-source-model.js
      - name: Smoke check correction remediation knowledge execution gates
        run: node scripts/smoke-check-correction-remediation-knowledge-execution-gates.js
      - name: Smoke check correction remediation knowledge rollback gates
        run: node scripts/smoke-check-correction-remediation-knowledge-rollback-gates.js
      - name: Smoke check correction remediation autopilot queue
        run: node scripts/smoke-check-correction-remediation-autopilot-queue.js
      - name: Smoke check correction remediation autopilot handoff
        run: node scripts/smoke-check-correction-remediation-autopilot-handoff.js
      - name: Smoke check correction remediation autopilot rollback readiness
        run: node scripts/smoke-check-correction-remediation-autopilot-rollback-readiness.js
      - name: Smoke check correction remediation autopilot trust timeline
        run: node scripts/smoke-check-correction-remediation-autopilot-trust-timeline.js
      - name: Smoke check correction remediation autopilot trust timeline browser QA
        run: node scripts/smoke-check-correction-remediation-autopilot-trust-timeline-browser-qa.js
      - name: Smoke check correction remediation autopilot timeline receipts
        run: node scripts/smoke-check-correction-remediation-autopilot-timeline-receipts.js
      - name: Smoke check correction remediation autopilot timeline receipts browser QA
        run: node scripts/smoke-check-correction-remediation-autopilot-timeline-receipts-browser-qa.js
      - name: Smoke check cross-repo architecture and security review
        run: node scripts/smoke-check-cross-repo-architecture-security-review.js
      - name: Smoke check chat-first free activation canary
        run: node scripts/smoke-check-chat-first-free-activation-canary.js
      - name: Smoke check smooth active-node chat
