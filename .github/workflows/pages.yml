      - name: Smoke check context correction suggestions
        run: node scripts/smoke-check-context-correction-suggestions.js
      - name: Smoke check protected context correction sync
        run: node scripts/smoke-check-protected-context-correction-sync.js
      - name: Smoke check protected correction sync UI
        run: node scripts/smoke-check-protected-correction-sync-ui.js
      - name: Smoke check protected correction review queue
        run: node scripts/smoke-check-protected-correction-review-queue.js
      - name: Smoke check correction remediation plan
