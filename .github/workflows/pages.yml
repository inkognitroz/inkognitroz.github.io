name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Smoke check static site
        run: node scripts/smoke-check-pages.js
      - name: Check MMIR API route manifest
        run: node scripts/check-api-route-manifest.js
      - name: Smoke check UI action coverage
        run: node scripts/smoke-check-ui-actions.js
      - name: Smoke check mobile chat layout
        run: node scripts/smoke-check-mobile-chat.js
      - name: Smoke check mobile first-chat journey
        run: node scripts/smoke-check-mobile-first-chat-journey.js
      - name: Smoke check frontpage chat usability
        run: node scripts/smoke-check-frontpage-chat-usability.js
      - name: Smoke check performance budget
        run: node scripts/smoke-check-performance-budget.js
      - name: Smoke check first journey with mock local connector
        run: node scripts/smoke-check-first-journey-mock-local.js
      - name: Smoke check local install return
        run: node scripts/smoke-check-local-install-return.js
      - name: Smoke check installer release QA
        run: node scripts/smoke-check-installer-release-qa.js
      - name: Smoke check installer-to-live-model proof
        run: node scripts/smoke-check-installer-to-live-model-proof.js
      - name: Smoke check free live-route hardening
        run: node scripts/smoke-check-free-live-route-hardening.js
      - name: Smoke check no-model dead-end browser gate
        run: node scripts/smoke-check-no-model-dead-end-browser.js
      - name: Smoke check first-chat no-model DOM fixture
        run: node scripts/smoke-check-first-chat-no-model-dom-fixture.js
      - name: Smoke check no-model visual pass
        run: node scripts/smoke-check-no-model-visual-pass.js

      - name: Smoke check public no-model deploy verification
        run: node scripts/smoke-check-public-no-model-deploy-verification.js

      - name: Smoke check first free chat response QA
        run: node scripts/smoke-check-first-free-chat-response-qa.js

      - name: Smoke check composer action bar usefulness
        run: node scripts/smoke-check-composer-action-bar-usefulness.js

      - name: Smoke check composer action bar visual
        run: node scripts/smoke-check-composer-action-bar-visual.js
      - name: Smoke check message action completeness
        run: node scripts/smoke-check-message-action-completeness.js
      - name: Smoke check message action visual
        run: node scripts/smoke-check-message-action-visual.js
      - name: Smoke check message action browser fixture
        run: node scripts/smoke-check-message-action-browser-fixture.js
      - name: Smoke check message action accessibility
        run: node scripts/smoke-check-message-action-accessibility.js
      - name: Smoke check conversation handoff
        run: node scripts/smoke-check-conversation-handoff.js
      - name: Smoke check saved chat memory handoff
        run: node scripts/smoke-check-saved-chat-memory-handoff.js
      - name: Smoke check promoted context next answer
        run: node scripts/smoke-check-promoted-context-next-answer.js
      - name: Smoke check context controls
        run: node scripts/smoke-check-context-controls.js
      - name: Smoke check answer context receipt
        run: node scripts/smoke-check-answer-context-receipt.js
      - name: Smoke check answer context drill-down
        run: node scripts/smoke-check-answer-context-drilldown.js
