name: MMIR cache-bust hotfix

on:
  push:
    paths:
      - .github/workflows/mmir-cachebust-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply MMIR platform status cache bust
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'public/mmir.html';
          const from = './apps/mimir-chat-portal/platform-status.js?v=20260524-quiet-first-paint-v3';
          const to = './apps/mimir-chat-portal/platform-status.js?v=20260524-status-static-v1';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(from)) {
            if (source.includes(to)) process.exit(0);
            throw new Error('MMIR page missing platform-status cache key');
          }
          fs.writeFileSync(path, source.replace(from, to), 'utf8');
          NODE
      - name: Run targeted smoke checks
        run: |
          node scripts/smoke-check-deploy-verification.js
          node scripts/smoke-check-performance-budget.js
          node scripts/smoke-check-mobile-first-chat-journey.js
          node scripts/smoke-check-public-no-model-deploy-verification.js
      - name: Commit and push hotfix
        run: |
          if git diff --quiet; then
            echo "No hotfix diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mmir.html
          git commit -m "fix: bust MMIR platform status cache"
          git push origin HEAD:main
