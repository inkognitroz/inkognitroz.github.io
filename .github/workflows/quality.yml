name: Static quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          find public -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check for forbidden frontend secrets
        run: |
          set -euo pipefail
          ! grep -RInE 'ghp_[A-Za-z0-9_]+|sk_live_[A-Za-z0-9_]+|sk_test_[A-Za-z0-9_]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' public || \
            (echo 'Forbidden token-like string found in public frontend files.' && exit 1)
          ! grep -RInE 'SUPABASE_SERVICE_ROLE\s*=|STRIPE_SECRET\s*=|OPENAI_API_KEY\s*=|ANTHROPIC_API_KEY\s*=' public docs README.md START_HERE.md AGENTS.md CLAUDE.md || \
            (echo 'Forbidden secret assignment found. Use placeholders and server-side environment variables only.' && exit 1)
          node scripts/public-safety-audit.js

      - name: Check required Mimir entrypoints
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/admin.html
          test -f public/internal.html
          test -f public/content.json
          test -f public/ai-model-catalog.json
          test -f public/provider-registry.json
          test -f public/model-role-presets.json
          test -f public/local-connector-guide.json
          test -f public/apps/mimir-chat-portal/mimir-chat-portal.js
          test -f public/apps/mimir-chat-portal/model-catalog-ui.js
          test -f public/apps/mimir-chat-portal/provider-status.js
          test -f public/apps/mimir-chat-portal/role-presets.js
          test -f public/apps/mimir-chat-portal/local-connector.js
          test -f public/apps/open-web-gui/index.html
          test -f public/apps/ollama-chat-lab/index.html
          test -f public/apps/app-template-generator/index.html
          test -f public/apps/football-evolution-matrix/index.html

      - name: Smoke-check Mimir route references
        run: |
          set -euo pipefail
          grep -RIn 'SaaS Fabric' public/index.html
          grep -RIn 'data-section="appFactory"' public/index.html
          grep -RIn 'id="mimir-prompt"' public/mmir.html
          grep -RIn 'id="provider-status"' public/mmir.html
          grep -RIn 'id="provider-status-grid"' public/mmir.html
          grep -RIn 'id="local-connector"' public/mmir.html
          grep -RIn 'id="local-connector-grid"' public/mmir.html
          grep -RIn 'id="node-dashboard"' public/mmir.html
          grep -RIn 'id="node-dashboard-root"' public/mmir.html
          grep -RIn 'id="role-preset-grid"' public/mmir.html
          grep -RIn 'id="backend-settings"' public/mmir.html
          grep -RIn 'id="model-library-grid"' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/mimir-chat-portal.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/model-catalog-ui.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/provider-status.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/node-dashboard.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/role-presets.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/local-connector.js' public/mmir.html

      - name: Smoke-check MMIR user journeys
        run: node scripts/smoke-check-user-journeys.js

      - name: Smoke-check UI action coverage
        run: node scripts/smoke-check-ui-actions.js
