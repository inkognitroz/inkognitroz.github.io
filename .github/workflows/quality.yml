name: Static quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          find public -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check MMIR public branding
        run: node scripts/ensure-mmir-public-branding.js --check

      - name: Check for forbidden frontend secrets
        run: |
          set -euo pipefail
          ! grep -RInE 'ghp_[A-Za-z0-9_]+|sk_live_[A-Za-z0-9_]+|sk_test_[A-Za-z0-9_]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' public || \
            (echo 'Forbidden token-like string found in public frontend files.' && exit 1)
          ! grep -RInE 'SUPABASE_SERVICE_ROLE\s*=|STRIPE_SECRET\s*=|OPENAI_API_KEY\s*=|ANTHROPIC_API_KEY\s*=' public docs README.md START_HERE.md AGENTS.md CLAUDE.md || \
            (echo 'Forbidden secret assignment found. Use placeholders and server-side environment variables only.' && exit 1)
          node scripts/public-safety-audit.js

      - name: Check required Mimir entrypoints
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/admin.html
          test -f public/internal.html
          test -f public/content.json
          test -f public/ai-model-catalog.json
          test -f public/provider-registry.json
          test -f public/model-role-presets.json
          test -f public/local-connector-guide.json
          test -f public/apps/mimir-chat-portal/mimir-chat-portal.js
          test -f public/apps/mimir-chat-portal/model-catalog-ui.js
          test -f public/apps/mimir-chat-portal/provider-status.js
          test -f public/apps/mimir-chat-portal/role-presets.js
          test -f public/apps/mimir-chat-portal/local-connector.js
          test -f public/apps/open-web-gui/index.html
          test -f public/apps/ollama-chat-lab/index.html
          test -f public/apps/app-template-generator/index.html
          test -f public/apps/football-evolution-matrix/index.html

      - name: Check MMIR API route manifest
        run: node scripts/check-api-route-manifest.js

      - name: Smoke-check MMIR route references
        run: |
          set -euo pipefail
          grep -RIn 'MMIR' public/index.html
          grep -RIn 'Trusted AI Control Plane' public/index.html
          grep -RIn './mmir.html#mimir-instant-start' public/index.html
          ! grep -RIn 'SaaS Fabric' public/index.html public/content.json
          grep -RIn '"title": "MMIR"' public/content.json
          grep -RIn 'id="mimir-prompt"' public/mmir.html
          grep -RIn 'id="provider-status"' public/mmir.html
          grep -RIn 'id="provider-status-grid"' public/mmir.html
          grep -RIn 'id="local-connector"' public/mmir.html
          grep -RIn 'id="local-connector-grid"' public/mmir.html
          grep -RIn 'id="node-dashboard"' public/mmir.html
          grep -RIn 'id="node-dashboard-root"' public/mmir.html
          grep -RIn 'id="role-preset-grid"' public/mmir.html
          grep -RIn 'id="backend-settings"' public/mmir.html
          grep -RIn 'id="model-library-grid"' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/mimir-chat-portal.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/model-catalog-ui.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/provider-status.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/node-dashboard.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/role-presets.js' public/mmir.html
          grep -RIn './apps/mimir-chat-portal/local-connector.js' public/mmir.html

      - name: Smoke-check MMIR user journeys
        run: node scripts/smoke-check-user-journeys.js

      - name: Smoke-check UI action coverage
        run: node scripts/smoke-check-ui-actions.js

      - name: Smoke-check MMIR performance budget
        run: node scripts/smoke-check-performance-budget.js

      - name: Smoke-check first journey with mock local connector
        run: node scripts/smoke-check-first-journey-mock-local.js

      - name: Smoke-check local install return
        run: node scripts/smoke-check-local-install-return.js

      - name: Smoke-check activation simulator
        run: node scripts/smoke-check-activation-simulator.js

      - name: Smoke-check activation replay render
        run: node scripts/smoke-check-activation-replay-render.js

      - name: Smoke-check activation route map
        run: node scripts/smoke-check-activation-route-map.js

      - name: Smoke-check activation closure
        run: node scripts/smoke-check-activation-closure.js

      - name: Smoke-check first screen activation closure
        run: node scripts/smoke-check-first-screen-activation-closure.js

      - name: Smoke-check device starter recommendation
        run: node scripts/smoke-check-device-starter-recommendation.js

      - name: Smoke-check recommended starter telemetry
        run: node scripts/smoke-check-recommended-starter-telemetry.js

      - name: Smoke-check critical shell headroom
        run: node scripts/smoke-check-critical-shell-headroom.js

      - name: Smoke-check starter to proof funnel
        run: node scripts/smoke-check-starter-to-proof-funnel.js

      - name: Smoke-check starter funnel continue
        run: node scripts/smoke-check-starter-funnel-continue.js

      - name: Smoke-check first screen starter funnel
        run: node scripts/smoke-check-first-screen-starter-funnel.js

      - name: Smoke-check first screen starter funnel continue
        run: node scripts/smoke-check-first-screen-starter-funnel-continue.js

      - name: Smoke-check recommended starter model focus
        run: node scripts/smoke-check-recommended-starter-model-focus.js

      - name: Smoke-check recommended starter install handoff
        run: node scripts/smoke-check-recommended-starter-install-handoff.js

      - name: Smoke-check starter install repair fallback
        run: node scripts/smoke-check-starter-install-repair-fallback.js

      - name: Smoke-check starter install retry after repair
        run: node scripts/smoke-check-starter-install-retry-after-repair.js

      - name: Smoke-check starter retry success closure
        run: node scripts/smoke-check-starter-retry-success-closure.js

      - name: Smoke-check first-answer send handoff
        run: node scripts/smoke-check-first-answer-send-handoff.js

      - name: Smoke-check first-answer next step
        run: node scripts/smoke-check-first-answer-next-step.js

      - name: Smoke-check visible-control dead ends
        run: node scripts/smoke-check-visible-control-dead-ends.js
