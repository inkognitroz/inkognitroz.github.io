      - name: Smoke-check activation route map
        run: node scripts/smoke-check-activation-route-map.js

      - name: Smoke-check activation closure
        run: node scripts/smoke-check-activation-closure.js

      - name: Smoke-check first screen activation closure
        run: node scripts/smoke-check-first-screen-activation-closure.js

      - name: Smoke-check device starter recommendation
        run: node scripts/smoke-check-device-starter-recommendation.js

