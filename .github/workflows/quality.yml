name: Static quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find public -name '*.json' -o -name '*.webmanifest' | while IFS= read -r file; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          find public scripts -name '*.js' -o -name '*.mjs' | while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check public boundary
        run: node scripts/check-public-boundary.js

      - name: Check public safety
        run: node scripts/public-safety-audit.js

      - name: Check MMIR branding
        run: node scripts/ensure-mmir-public-branding.js --check

      - name: Smoke check public shell
        run: node scripts/smoke-check-public-shell.js
