name: Static quality gates

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: static-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public site
    # Private-repo minutes are billable; operators can select an ephemeral
    # self-hosted runner without weakening the required check.
    runs-on: ${{ fromJSON(vars.MMIR_CI_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find public -name '*.json' -o -name '*.webmanifest' | while IFS= read -r file; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          find public scripts -name '*.js' -o -name '*.mjs' | while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check public boundary
        run: node scripts/check-public-boundary.js

      - name: Check public safety
        run: node scripts/public-safety-audit.js

      - name: Check MMIR branding
        run: node scripts/ensure-mmir-public-branding.js --check

      - name: Smoke check public shell
        run: node scripts/smoke-check-public-shell.js

      - name: Install responsive browser
        run: npx playwright install chromium

      - name: Responsive P0 render check
        run: npm run check:responsive

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-responsive-screenshots
          path: test-results/p0-responsive
          if-no-files-found: ignore
