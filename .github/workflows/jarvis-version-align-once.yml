name: Align reviewed Jarvis release identifiers
on:
  push:
    branches: [fix/jarvis-voice-reliability-20260919]
    paths: [.github/workflows/jarvis-version-align-once.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/jarvis-voice-reliability-20260919
          fetch-depth: 0
      - name: Apply reviewed exact source changes and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          subprocess.run(['git','merge-base','--is-ancestor','f647daacc71eadb7ddd7cc729758a7c5155ed5a3','HEAD'],check=True)
          before={'public/apps/mimir-chat-portal/asset-versions.json':'f41718c5cb23858079c059c7bd4f0a30aa820ccc','public/apps/mimir-chat-portal/p0-release-nav.js':'66a7d595a76e6fe4305d45a784945c1c05edd135','public/mmir.html':'5a3f211f9064cf3c821d0b5b3253055452da7aa0','scripts/smoke-check-release-0.2-catalogs.js':'369bc32ce3fc0036de5b0754e999210ca979d4f5','scripts/jarvis-reliability-scenarios.mjs':'696677d94f725fa84b018f852c7396d967485e14'}
          after={'public/apps/mimir-chat-portal/asset-versions.json':'220f6295b77b93fd35ba1337d6d536271a3abf662982cab85b584048467a517e','public/apps/mimir-chat-portal/p0-release-nav.js':'9fab91d14f84e63055f26190ffea32492d04bc2acc894bd7a8833c989fa59810','public/mmir.html':'e0094b81431d2e91305fe8a4a6077931049a3b797ecd05c83535e22fbf067435','scripts/smoke-check-release-0.2-catalogs.js':'832f3c0bda4ee7546e6910fd66f688d385ac79256ca3dd9731245ad8310281a0','scripts/jarvis-reliability-scenarios.mjs':'68bbf6f221297cd7b5ba287c52b796e595ed90b9cefb0e21ea78f14c59c15e0f'}
          for name,digest in before.items():
              path=pathlib.Path(name);assert path.is_file() and not path.is_symlink()
              raw=path.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==digest,name
          for name in list(before)[:4]:
              path=pathlib.Path(name);text=path.read_text()
              assert text.count('20260919-jarvis-v3.1')==1,name
              path.write_text(text.replace('20260919-jarvis-v3.1','20260919-jarvis-v3-1'))
          path=pathlib.Path('scripts/jarvis-reliability-scenarios.mjs');text=path.read_text()
          old="await control('consent').check();await control('test-dictation').click();assert.match(await page.locator('.mmir-jarvis-status').textContent(),/diktatprøve, ingen automatisk sending/);"
          new="await control('consent').check();await control('test-dictation').click();\n  // Recognition start is asynchronous; wait for its real UI event, not elapsed time.\n  await page.waitForFunction(()=>document.querySelector('.mmir-jarvis-status')?.textContent.includes('diktatprøve, ingen automatisk sending'),null,{timeout:5000});\n  assert.match(await page.locator('.mmir-jarvis-status').textContent(),/diktatprøve, ingen automatisk sending/);"
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          for name,digest in after.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--',*before],check=True)
          subprocess.run(['git','rm','--','.github/workflows/jarvis-version-align-once.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(jarvis): conform asset versions to existing gate and await recording-start event in test'
          git push origin HEAD:fix/jarvis-voice-reliability-20260919
