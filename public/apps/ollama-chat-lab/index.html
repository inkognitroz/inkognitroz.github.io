<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mimir Local Ollama Lab</title>
  <meta name="description" content="Local-first Mimir lab for testing Ollama models." />
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link rel="stylesheet" href="./ollama-chat-lab.css" />
</head>
<body class="mimir-tool-page">
  <header class="tool-header">
    <div class="container">
      <p class="tool-kicker">Mimir internal tool</p>
      <h1>Local Ollama Lab</h1>
      <p>Test local models before adding a backend to Mimir Chat.</p>
      <nav>
        <a href="../../index.html">Mimir Chat</a>
        <a href="../../admin.html">Admin</a>
        <a href="../../internal.html">Internal Tools</a>
      </nav>
    </div>
  </header>
  <main class="container app-main">
    <section class="card">
      <h2>Local model chat</h2>
      <p class="section-description">Start Ollama locally, load available models and test prompts. Browser access may require local CORS configuration.</p>
      <div class="chat-controls">
        <label>Ollama endpoint <input id="endpoint" value="http://localhost:11434" /></label>
        <button id="load-models" type="button">Load models</button>
        <label>Model <select id="model-select"><option value="">Load models first</option></select></label>
      </div>
      <label>Session title <input id="session-title" value="Mimir Local Session" /></label>
      <label>System prompt <textarea id="system-prompt" rows="3">You are a precise Mimir assistant. Be practical, concise and implementation-focused.</textarea></label>
      <div id="messages" class="messages" aria-live="polite"></div>
      <label>Message <textarea id="user-message" rows="4" placeholder="Ask the local model..."></textarea></label>
      <div class="actions-row">
        <button id="send" type="button">Send</button>
        <button id="clear" type="button">Clear</button>
        <button id="export-session" type="button">Export session JSON</button>
        <button id="import-session" type="button">Import session JSON</button>
      </div>
      <input id="import-session-file" type="file" accept="application/json,.json" hidden />
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./ollama-chat-lab.js"></script>
</body>
</html>
