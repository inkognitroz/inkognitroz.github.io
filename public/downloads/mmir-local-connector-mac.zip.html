    function bytesFromBase64(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }
    function downloadZip() {
      const blob = new Blob([bytesFromBase64(zipBase64)], { type: "application/zip" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      document.getElementById("status").textContent = "Download started.";
    }
    document.getElementById("download").addEventListener("click", downloadZip);
    window.setTimeout(downloadZip, 250);
