<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download MMIR Local Connector for Mac</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light; --text: #111827; --muted: #64748b; --line: #dbe7ef; --accent: #0f9f75; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: var(--text); }
    main { width: min(640px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: 0 24px 70px rgba(15, 23, 42, .08); }
    h1 { font-size: clamp(1.9rem, 7vw, 3.2rem); line-height: 1; margin: 0 0 16px; letter-spacing: 0; }
    p { color: var(--muted); line-height: 1.6; }
    a, button { border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; display: inline-flex; font: inherit; font-weight: 750; margin-top: 18px; min-height: 44px; align-items: center; padding: 0 18px; text-decoration: none; }
    code { color: var(--text); }
    small { color: var(--muted); display: block; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>MMIR Local Connector for Mac</h1>
    <p id="status">Starting the Mac Connector ZIP download...</p>
    <a id="download" href="./mmir-local-connector-mac.zip" download>Download Mac Connector ZIP</a>
    <p>Open the ZIP, then open <strong>mmir-local-connector-mac.command</strong>. The connector starts the private MMIR API on <code>127.0.0.1:3000</code>.</p>
    <small>If macOS blocks the unsigned command, right-click it and choose Open.</small>
  </main>
  <script>
    const link = document.getElementById('download');
    const statusEl = document.getElementById('status');
    function startDownload() {
      statusEl.textContent = 'Download started. Open the ZIP, then open mmir-local-connector-mac.command.';
      link.click();
    }
    window.setTimeout(startDownload, 250);
  </script>
</body>
</html>
