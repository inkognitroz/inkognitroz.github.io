<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download MMIR Local Connector for Mac</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101418; color: #f6f8fb; }
    main { width: min(640px, calc(100vw - 32px)); }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1; margin: 0 0 16px; letter-spacing: 0; }
    p { color: #b9c2cf; line-height: 1.6; }
    a, button { border: 0; border-radius: 8px; background: #7ed957; color: #121612; cursor: pointer; display: inline-flex; font: inherit; font-weight: 700; margin-top: 18px; padding: 12px 16px; text-decoration: none; }
    button[disabled] { cursor: progress; opacity: .72; }
    small { color: #8c98a8; display: block; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>MMIR Local Connector for Mac</h1>
    <p id="status">Preparing download...</p>
    <button id="download" type="button">Download Mac Connector ZIP</button>
    <p>After download, open the ZIP, then open <strong>mmir-local-connector-mac.command</strong>. The connector starts the private MMIR API on <code>127.0.0.1:3000</code>.</p>
    <small>Installer source SHA-256: c8c3cfbf1efee05e2039e77808d3cbbebc10210a32e1f4e0cc010a5f2736f9b1</small>
  </main>
  <script>
    const commandUrl = './mmir-local-connector-mac.command';
    const zipName = 'mmir-local-connector-mac.zip';
    const commandName = 'mmir-local-connector-mac.command';
    const workspaceKey = 'mimir-active-workspace-v1';
    const repairResumePrefix = 'mimir-repair-resume-v1:';
    const downloadButton = document.getElementById('download');
    const statusEl = document.getElementById('status');

    function readRepairResume() {
      try {
        const workspace = localStorage.getItem(workspaceKey) || 'personal';
        const resume = JSON.parse(localStorage.getItem(repairResumePrefix + workspace) || 'null');
        return resume && typeof resume === 'object' ? resume : null;
      } catch (error) {
        return null;
      }
    }

    function selectedInstallModel() {
      const model = new URLSearchParams(location.search).get('model') || readRepairResume()?.model || '';
      return String(model).trim();
    }

    function shellQuote(value) {
      return "'" + String(value).replace(/'/g, "'\"'\"'") + "'";
    }

    function withSelectedModel(command) {
      const model = selectedInstallModel();
      if (!model) return command;
      const exportLine = 'export MMIR_MODEL=' + shellQuote(model) + '\n';
      return String(command).startsWith('#!')
        ? String(command).replace('\n', '\n' + exportLine)
        : exportLine + String(command);
    }

    function makeCrcTable() {
      const table = new Uint32Array(256);
      for (let index = 0; index < 256; index += 1) {
        let value = index;
        for (let bit = 0; bit < 8; bit += 1) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
        table[index] = value >>> 0;
      }
      return table;
    }

    const crcTable = makeCrcTable();

    function crc32(bytes) {
      let value = 0xffffffff;
      for (let index = 0; index < bytes.length; index += 1) value = crcTable[(value ^ bytes[index]) & 0xff] ^ (value >>> 8);
      return (value ^ 0xffffffff) >>> 0;
    }

    function dosDateTime(date) {
      const year = Math.max(date.getFullYear(), 1980);
      const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { time, date: dosDate };
    }

    function writeUint16(view, offset, value) {
      view.setUint16(offset, value, true);
      return offset + 2;
    }

    function writeUint32(view, offset, value) {
      view.setUint32(offset, value >>> 0, true);
      return offset + 4;
    }

    function copyInto(target, offset, source) {
      target.set(source, offset);
      return offset + source.length;
    }

    function createZip(fileName, fileBytes) {
      const encoder = new TextEncoder();
      const nameBytes = encoder.encode(fileName);
      const { time, date } = dosDateTime(new Date());
      const crc = crc32(fileBytes);
      const localHeaderSize = 30 + nameBytes.length;
      const centralHeaderSize = 46 + nameBytes.length;
      const centralOffset = localHeaderSize + fileBytes.length;
      const totalSize = centralOffset + centralHeaderSize + 22;
      const zip = new Uint8Array(totalSize);
      const view = new DataView(zip.buffer);
      let offset = 0;

      offset = writeUint32(view, offset, 0x04034b50);
      offset = writeUint16(view, offset, 20);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, time);
      offset = writeUint16(view, offset, date);
      offset = writeUint32(view, offset, crc);
      offset = writeUint32(view, offset, fileBytes.length);
      offset = writeUint32(view, offset, fileBytes.length);
      offset = writeUint16(view, offset, nameBytes.length);
      offset = writeUint16(view, offset, 0);
      offset = copyInto(zip, offset, nameBytes);
      offset = copyInto(zip, offset, fileBytes);

      offset = writeUint32(view, offset, 0x02014b50);
      offset = writeUint16(view, offset, 0x0314);
      offset = writeUint16(view, offset, 20);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, time);
      offset = writeUint16(view, offset, date);
      offset = writeUint32(view, offset, crc);
      offset = writeUint32(view, offset, fileBytes.length);
      offset = writeUint32(view, offset, fileBytes.length);
      offset = writeUint16(view, offset, nameBytes.length);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint32(view, offset, 0o100755 * 0x10000);
      offset = writeUint32(view, offset, 0);
      offset = copyInto(zip, offset, nameBytes);

      offset = writeUint32(view, offset, 0x06054b50);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 0);
      offset = writeUint16(view, offset, 1);
      offset = writeUint16(view, offset, 1);
      offset = writeUint32(view, offset, centralHeaderSize);
      offset = writeUint32(view, offset, centralOffset);
      writeUint16(view, offset, 0);

      return zip;
    }

    async function downloadZip() {
      downloadButton.disabled = true;
      statusEl.textContent = 'Preparing download...';
      try {
        const response = await fetch(commandUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not fetch installer source');
        const command = withSelectedModel(await response.text());
        const zip = createZip(commandName, new TextEncoder().encode(command));
        const blob = new Blob([zip], { type: 'application/zip' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = zipName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        statusEl.textContent = selectedInstallModel() ? 'Download started with ' + selectedInstallModel() + ' preselected.' : 'Download started.';
      } catch (error) {
        statusEl.textContent = 'Download failed. Use the direct installer link below.';
        const fallback = document.createElement('a');
        fallback.href = commandUrl;
        fallback.download = commandName;
        fallback.textContent = 'Download direct .command installer';
        document.querySelector('main').appendChild(fallback);
      } finally {
        downloadButton.disabled = false;
      }
    }

    if (selectedInstallModel()) {
      statusEl.textContent = 'Preparing Mac installer with ' + selectedInstallModel() + ' selected...';
    }
    downloadButton.addEventListener('click', downloadZip);
    window.setTimeout(downloadZip, 250);
  </script>
</body>
</html>
