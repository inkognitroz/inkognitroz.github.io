<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMIR.ai</title>
  <meta name="description" content="MMIR opens the chat surface. Readiness is checked on the chat surface before use." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MMIR" />
  <meta http-equiv="refresh" content="0; url=./mmir.html#mimir-instant-start" />
  <link rel="canonical" href="./mmir.html" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/mmir-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/mmir-maskable-icon.svg" />
  <style>
    :root{color-scheme:dark;background:#080d1f;color:#f8fbff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#fff;color:#0f172a}
    main{width:min(680px,calc(100vw - 32px));display:grid;gap:16px;text-align:center}
    p{line-height:1.55;color:#475569;margin:0 auto;max-width:560px}a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:#0f172a;color:#fff;font-weight:800;text-decoration:none}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#047857;font-weight:800;font-size:.78rem}h1{font-size:clamp(2.4rem,8vw,5rem);margin:0;letter-spacing:0}
  </style>
  <script>
    (function(){
      var allowed = new Set(['#connect-options','#mimir-instant-start','#mimir-chat-portal','#node-dashboard','#model-library','#platform-status','#pwa-install','#identity-orgs']);
      var legacy = new Set(['#app-factory','#apps','#roadmap','#about']);
      var target = new URL('./mmir.html', window.location.href);
      target.hash = allowed.has(window.location.hash) && !legacy.has(window.location.hash) ? window.location.hash : '#mimir-instant-start';
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Chat-first MMIR entry</p>
    <h1>MMIR</h1>
    <p>Opening MMIR chat. Readiness is checked on the chat surface before use.</p>
    <p><a href="./mmir.html#mimir-instant-start">Open MMIR chat</a></p>
  </main>
</body>
</html>
