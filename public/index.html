<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMIR.ai</title>
  <meta name="description" content="MMIR is the orchestration layer for trusted AI: connect local AI, route models safely and control your AI infrastructure." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MMIR" />
  <meta http-equiv="refresh" content="0; url=./mmir.html#mimir-instant-start" />
  <link rel="canonical" href="./mmir.html" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/mmir-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/mmir-maskable-icon.svg" />
  <style>
    :root{color-scheme:dark;background:#080d1f;color:#f8fbff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#080d1f,#142a5c 58%,#0f766e)}
    main{width:min(680px,calc(100vw - 32px));padding:32px;border:1px solid rgba(255,255,255,.18);background:rgba(8,13,31,.72);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    p{line-height:1.6;color:#d8e6ff}a{color:#9fd8ff;font-weight:800}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#79f2c0;font-weight:800;font-size:.78rem}h1{font-size:clamp(2rem,7vw,4rem);margin:.35rem 0 .75rem;letter-spacing:0}
  </style>
  <script>
    (function(){
      var allowed = new Set(['#connect-options','#mimir-instant-start','#mimir-chat-portal','#node-dashboard','#model-library','#progress-dashboard','#platform-status','#pwa-install','#identity-orgs']);
      var legacy = new Set(['#app-factory','#apps','#roadmap','#about']);
      var target = new URL('./mmir.html', window.location.href);
      target.hash = allowed.has(window.location.hash) && !legacy.has(window.location.hash) ? window.location.hash : '#mimir-instant-start';
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Trusted AI Control Plane</p>
    <h1>MMIR</h1>
    <p>MMIR is the orchestration layer for trusted AI. The old app-factory page is no longer the public identity for mmir.ai.</p>
    <p><a href="./mmir.html#mimir-instant-start">Open MMIR</a></p>
  </main>
</body>
</html>
