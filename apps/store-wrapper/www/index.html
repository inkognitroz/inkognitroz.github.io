<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Supergeni</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 420px; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    .accent { color: #14b8a6; }
    p { line-height: 1.5; opacity: .85; }
    button {
      margin-top: 1rem; padding: .75rem 1.5rem; border: 0; border-radius: 9999px;
      background: #14b8a6; color: #0f172a; font-weight: 600; font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- Lokal fallback-side. Vises kun naar https://mmir.ai ikke kan naas
       (server.errorPath i capacitor.config.ts). Normal drift laster live-PWA-en. -->
  <div class="card">
    <h1>Super<span class="accent">geni</span></h1>
    <p>Ingen nettforbindelse akkurat naa. Supergeni trenger nett for aa hente
       ferske, etterproevbare svar.</p>
    <button onclick="location.reload()">Proev igjen</button>
  </div>
</body>
</html>
